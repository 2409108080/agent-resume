<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0b1a;
    --surface: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --text: #e4e4ef;
    --text-muted: #8888a4;
    --accent: #6c5ce7;
    --accent-light: #a29bfe;
    --user-bg: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
    --radius-lg: 22px;
    --font: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  html, body {
    height: 100%;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ===== Background Orbs ===== */
  .bg-orbs {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .bg-orbs span {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3;
    animation: orbFloat 20s ease-in-out infinite alternate;
  }
  .bg-orbs span:nth-child(1) {
    width: 300px; height: 300px; background: var(--accent);
    top: -100px; left: -50px; animation-duration: 25s;
  }
  .bg-orbs span:nth-child(2) {
    width: 250px; height: 250px; background: #00cec9;
    bottom: -80px; right: -30px; animation-duration: 22s; animation-delay: -5s;
  }
  .bg-orbs span:nth-child(3) {
    width: 180px; height: 180px; background: #fd79a8;
    top: 50%; left: 60%; animation-duration: 28s; animation-delay: -12s;
  }
  @keyframes orbFloat {
    0%   { transform: translate(0,0) scale(1); }
    33%  { transform: translate(40px,-30px) scale(1.05); }
    66%  { transform: translate(-20px,50px) scale(0.95); }
    100% { transform: translate(30px,20px) scale(1.08); }
  }

  /* ===== App Container ===== */
  .app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    max-height: 100vh;
  }

  /* ===== Header ===== */
  .header {
    flex-shrink: 0;
    padding: 16px 20px;
    display: flex; align-items: center; gap: 14px;
    background: rgba(11,11,26,0.75);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    border-bottom: 1px solid var(--border);
  }
  .header-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--user-bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    box-shadow: 0 0 20px rgba(108,92,231,0.35);
    animation: avatarPulse 3s ease-in-out infinite;
    position: relative;
  }
  .header-avatar::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid var(--accent-light); opacity: 0.4;
    animation: ringPulse 3s ease-in-out infinite;
  }
  @keyframes avatarPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  @keyframes ringPulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.08); }
  }
  .header-info { flex: 1; min-width: 0; }
  .header-name {
    font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .header-status {
    font-size: 12px; color: #00cec9;
    display: flex; align-items: center; gap: 5px; margin-top: 2px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #00cec9; flex-shrink: 0;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* ===== Messages ===== */
  .messages {
    flex: 1; overflow-y: auto; padding: 20px 16px 8px;
    scroll-behavior: smooth; overscroll-behavior: contain;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  .msg-group {
    margin-bottom: 6px;
    animation: msgIn 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg-row {
    display: flex; gap: 10px; max-width: 85%;
  }
  .msg-row.ai   { align-self: flex-start; }
  .msg-row.user { align-self: flex-end; margin-left: auto; flex-direction: row-reverse; }

  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .msg-row.ai .msg-avatar {
    background: var(--user-bg);
    box-shadow: 0 0 12px rgba(108,92,231,0.35);
  }
  .msg-row.user .msg-avatar {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
  }

  .msg-bubble {
    padding: 12px 16px; border-radius: var(--radius-lg);
    font-size: 14.5px; line-height: 1.65;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg-row.ai .msg-bubble {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-top-left-radius: 4px;
  }
  .msg-row.user .msg-bubble {
    background: var(--user-bg); border-top-right-radius: 4px;
    box-shadow: 0 4px 20px rgba(108,92,231,0.35);
  }

  .msg-time {
    font-size: 11px; color: var(--text-muted); margin-top: 4px; opacity: 0.7;
  }
  .msg-row.user .msg-time { text-align: right; }

  /* System message */
  .system-msg {
    text-align: center; padding: 12px 16px; margin: 12px 0;
    font-size: 12px; color: var(--text-muted);
    animation: msgIn 0.4s ease;
  }
  .system-msg span {
    background: var(--surface);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    padding: 6px 16px; border-radius: 20px;
  }

  /* Welcome card */
  .welcome-card {
    text-align: center; padding: 32px 20px; margin: 16px 0;
    animation: msgIn 0.5s ease;
  }
  .welcome-icon { font-size: 48px; margin-bottom: 12px; display: block; }
  .welcome-title {
    font-size: 18px; font-weight: 700; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent-light), #00cec9);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .welcome-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

  /* Chips */
  .suggestions {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    padding: 8px 16px 4px;
    animation: msgIn 0.5s ease 0.2s both;
  }
  .chip {
    padding: 8px 16px; border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 13px; cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    white-space: nowrap;
  }
  .chip:hover {
    background: rgba(255,255,255,0.1);
    color: var(--accent-light);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .chip:active { transform: scale(0.97); }

  /* Typing indicator */
  .typing-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-light); opacity: 0.5;
    display: inline-block; margin-right: 4px;
    animation: typingDot 1.4s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingDot {
    0%,60%,100% { opacity: 0.3; transform: scale(0.8); }
    30% { opacity: 1; transform: scale(1.1); }
  }

  /* Input Area */
  .input-area {
    flex-shrink: 0;
    padding: 12px 16px 16px;
    background: rgba(11,11,26,0.75);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    border-top: 1px solid var(--border);
  }
  .input-bar {
    display: flex; align-items: flex-end; gap: 10px;
    max-width: 800px; margin: 0 auto;
  }
  .input-wrapper {
    flex: 1; display: flex; align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 4px 6px 4px 16px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    min-width: 0;
  }
  .input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,92,231,0.35);
  }
  .input-wrapper textarea {
    flex: 1; border: none; background: transparent;
    color: var(--text);
    font-family: var(--font); font-size: 14.5px; line-height: 1.5;
    resize: none; outline: none; padding: 8px 0;
    max-height: 120px; min-height: 22px; height: 22px;
    scrollbar-width: none;
    -webkit-scrollbar: none;
  }
  .input-wrapper textarea::-webkit-scrollbar { display: none; }
  .input-wrapper textarea::placeholder { color: var(--text-muted); opacity: 0.6; }

  .send-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: var(--user-bg); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s ease;
    box-shadow: 0 2px 12px rgba(108,92,231,0.35);
  }
  .send-btn:hover { transform: scale(1.08); box-shadow: 0 4px 20px rgba(108,92,231,0.35); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .send-btn:not(:disabled):hover svg { transform: translateX(1px); }

  .input-hint {
    text-align: center; font-size: 11px;
    color: var(--text-muted); opacity: 0.5; margin-top: 8px;
  }

  /* Desktop */
  @media (min-width: 768px) {
    .messages { padding: 28px 24px 12px; }
    .msg-row { max-width: 70%; }
    .input-area { padding: 16px 24px 20px; }
    .welcome-card { padding: 48px 40px; }
    .welcome-icon { font-size: 64px; }
    .welcome-title { font-size: 24px; }
    .welcome-desc { font-size: 14px; max-width: 500px; margin: 0 auto; }
    .header-avatar { width: 46px; height: 46px; font-size: 22px; }
  }

  /* Mobile */
  @media (max-width: 480px) {
    .header { padding: 12px 14px; gap: 10px; }
    .header-avatar { width: 38px; height: 38px; font-size: 18px; }
    .header-name { font-size: 14px; }
    .msg-row { max-width: 90%; }
    .input-wrapper { padding: 2px 4px 2px 12px; }
    .input-hint { display: none; }
  }

  /* Code in messages */
  .msg-bubble code {
    background: rgba(0,0,0,0.3); padding: 2px 6px;
    border-radius: 4px; font-size: 13px;
  }
  .msg-bubble pre {
    background: rgba(0,0,0,0.3); padding: 12px 16px;
    border-radius: 8px; overflow-x: auto; margin: 8px 0;
  }
  .msg-bubble pre code { background: none; padding: 0; }
</style>
</head>
<body>

<div class="bg-orbs"><span></span><span></span><span></span></div>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-avatar">🧑‍</div>
    <div class="header-info">
      <div class="header-name">张文远 · AI Agent</div>
      <div class="header-status">
        <span class="status-dot"></span>
        在线 · 随时交谈
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="send-btn" id="btnClear" title="清空对话" style="background:rgba(255,255,255,0.08);box-shadow:none;font-size:16px;width:36px;height:36px;">🗑️</button>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages"></div>

  <!-- Suggestions -->
  <div class="suggestions" id="suggestions"></div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-bar">
      <div class="input-wrapper">
        <textarea id="userInput" placeholder="问问我关于他的技术栈、项目经验..." rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="input-hint">按 Enter 发送 · Shift+Enter 换行</div>
  </div>
</div>

<script>
// DOM elements
const messagesEl     = document.getElementById('messages');
const suggestionsEl  = document.getElementById('suggestions');
const userInput      = document.getElementById('userInput');
const sendBtn        = document.getElementById('sendBtn');
const btnClear       = document.getElementById('btnClear');

// State
let conversationHistory = [];
let isLoading = false;

// Helpers
function timeStr() {
  return new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
}
function scrollToBottom() {
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

// Render functions
function addWelcomeCard() {
  const div = document.createElement('div');
  div.className = 'welcome-card';
  div.innerHTML = `
    <span class="welcome-icon">👋</span>
    <div class="welcome-title">你好！我是张文远的 AI Agent</div>
    <div class="welcome-desc">
      我了解他所有的技术能力、项目经验和成长经历。<br>
      你可以直接提问，我会如实作答 😄<br><br>
      <small style="opacity:0.6">⚡ 本对话项目由 vibecoding 编写 · AI Agent 智能体</small>
    </div>`;
  messagesEl.appendChild(div);
}

function addSuggestionChips() {
  const chips = [
    '你会什么技术？',
    '你做过哪些项目？',
    '你都在哪里工作过？',
    '介绍一下你自己',
  ];
  suggestionsEl.innerHTML = '';
  chips.forEach(text => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = text;
    btn.onclick = () => handleSend(text);
    suggestionsEl.appendChild(btn);
  });
}

function addMessage(role, content, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const group = document.createElement('div');
      group.className = 'msg-group';

      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'ai' ? '🤖' : '🧑';
      row.appendChild(avatar);

      const container = document.createElement('div');
      container.style.cssText = 'flex:1;min-width:0;';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = formatContent(content);
      container.appendChild(bubble);

      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = timeStr();
      container.appendChild(timeEl);

      row.appendChild(container);
      group.appendChild(row);
      messagesEl.appendChild(group);
      scrollToBottom();
      resolve();
    }, delay);
  });
}

function showTyping() {
  const group = document.createElement('div');
  group.className = 'msg-group';
  group.id = 'typingGroup';
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = '🤖';
  row.appendChild(avatar);
  const container = document.createElement('div');
  container.style.cssText = 'flex:1;min-width:0;';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  container.appendChild(bubble);
  row.appendChild(container);
  group.appendChild(row);
  messagesEl.appendChild(group);
  scrollToBottom();
}
function removeTyping() {
  const el = document.getElementById('typingGroup');
  if (el) el.remove();
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.innerHTML = `<span>${text}</span>`;
  messagesEl.appendChild(div);
  scrollToBottom();
}

function formatContent(text) {
  let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return html.replace(/\n/g,'<br>');
}

async function clearMessages() {
  messagesEl.innerHTML = '';
  conversationHistory = [];
  addWelcomeCard();
  addSuggestionChips();
  addSystemMsg('对话已清空 ✨');
}

// Call backend API
async function callBackend(messages) {
  try {
    const res = await fetch('https://agent-resume-kqup5x3d5-2409108080.vercel.app/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.response;
  } catch (err) {
    console.error('API error:', err);
    return '抱歉，我暂时遇到了一点问题，请稍后再试。';
  }
}

// Send handler
async function handleSend(text) {
  text = text.trim();
  if (!text || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  suggestionsEl.innerHTML = '';
  userInput.value = '';
  userInput.style.height = '22px';

  await addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  showTyping();
  const reply = await callBackend(conversationHistory);
  removeTyping();

  await addMessage('ai', reply);
  conversationHistory.push({ role: 'assistant', content: reply });

  isLoading = false;
  sendBtn.disabled = false;
  userInput.focus();
}

// Input events
userInput.addEventListener('input', () => {
  userInput.style.height = '22px';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  sendBtn.disabled = !userInput.value.trim() || isLoading;
});

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend(userInput.value);
  }
});

sendBtn.addEventListener('click', () => handleSend(userInput.value));
btnClear.addEventListener('click', clearMessages);

// Init
window.addEventListener('DOMContentLoaded', () => {
  addWelcomeCard();
  addSuggestionChips();
  userInput.focus();
});
</script>
</body>
</html>
